
spring.application.name=cv-ai

# Configure OpenAI client to use Docker Model Runner
spring.ai.openai.base-url=http://localhost:12434/engines
spring.ai.openai.api-key=test
spring.ai.openai.chat.options.model=ai/deepseek-r1-distill-llama

# Docker Model Runner doesn't support embeddings, so disable them
spring.ai.openai.embedding.enabled=false